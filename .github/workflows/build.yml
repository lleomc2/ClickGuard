name: Build Android

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build ClickGuard for Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK 30 and Ninja
        run: |
          sdkmanager --install "ndk;30.0.16248370"
          sudo apt-get update
          sudo apt-get install -y ninja-build
          test -f "$ANDROID_SDK_ROOT/ndk/30.0.16248370/build/cmake/android.toolchain.cmake"
          ninja --version

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: 5.11.2
          build-config: Release
          android-ndk-version: 30.0.16248370

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: ClickGuard-Android
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
